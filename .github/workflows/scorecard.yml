# OpenSSF Scorecard evaluates the repository's supply-chain posture. It runs on
# the default branch only — on push, weekly, and when branch protection rules
# change — because results published to the public Scorecard API must describe
# main. The analysis job needs security-events: write to upload the SARIF report
# and id-token: write to sign the published results; everything else is
# read-only.
name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  # Run weekly even with no repository activity: the checks (branch protection,
  # dependency pinning, token permissions) can change outside our commits.
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write

    steps:
      # persist-credentials: false keeps the token out of .git/config, so a
      # compromised step later in the job cannot push with it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the score to the public API the README badge reads from.
          publish_results: true

      - name: Upload results as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
