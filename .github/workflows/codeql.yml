# CodeQL scans Go on every push to main, on pull requests, and weekly so new
# queries are applied to code that has not changed. Only the analysis job needs
# to write: SARIF results are uploaded to code scanning, which requires
# security-events: write. Everything else is read-only.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A weekly run catches code that new or updated queries would now flag.
  schedule:
    - cron: "41 6 * * 3"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
          # Always the newest patch release: security fixes land there.
          check-latest: true

      # security-extended adds the queries beyond the default suite. They are
      # noisier in general, but this codebase handles signing keys, so the
      # extra reach is worth an occasional dismissed alert.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: go
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:go"
